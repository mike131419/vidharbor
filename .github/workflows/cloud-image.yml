name: Cloud web app image

# Builds the Docker image Render (or any host) runs, checks it works, and
# tries real links from a data-centre machine.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['vidharbor/**', 'Dockerfile', 'requirements-server.txt', 'tests/**', '.github/workflows/cloud-image.yml']

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t vidharbor-cloud .

      - name: Make a test video
        run: |
          mkdir -p site
          docker run --rm -u root -v "$PWD/site:/site" vidharbor-cloud \
            ffmpeg -loglevel error -f lavfi -i testsrc=size=320x240:rate=25 -f lavfi -i sine=frequency=440 \
                   -t 2 -c:v libx264 -pix_fmt yuv420p -c:a aac /site/clip.mp4
          echo '<html><head><title>Cloud test</title></head><body><video src="/clip.mp4"></video></body></html>' > site/page.html
          (cd site && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)

      - name: Start the web app
        run: |
          docker run -d --name vh --network host -e PORT=8787 -e VIDHARBOR_CODE=TEST-CODE-0001 vidharbor-cloud
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8787/api/ping && break
            sleep 2
          done
          docker logs vh

      - name: Smoke test (sign in, download, MP3, file)
        run: |
          set -e
          curl -sf http://127.0.0.1:8787/ | grep -q VidHarbor
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/jobs)" = 401
          curl -sf -c jar -H 'Content-Type: application/json' -d '{"code":"test code 0001"}' http://127.0.0.1:8787/api/login
          curl -sf -b jar -H 'Content-Type: application/json' -d '{"text":"look 看看 http://127.0.0.1:8765/page.html","mode":"video"}' http://127.0.0.1:8787/api/jobs
          curl -sf -b jar -H 'Content-Type: application/json' -d '{"text":"http://127.0.0.1:8765/clip.mp4","mode":"mp3"}' http://127.0.0.1:8787/api/jobs
          for i in $(seq 1 60); do
            states=$(curl -s -b jar http://127.0.0.1:8787/api/jobs | python3 -c "import json,sys; print(' '.join(j['state'] for j in json.load(sys.stdin)['jobs']))")
            echo "$states"
            case "$states" in *queued*|*running*) sleep 2 ;; *) break ;; esac
          done
          test "$states" = "done done"
          curl -s -b jar http://127.0.0.1:8787/api/jobs | python3 -c "
          import json,sys
          for j in json.load(sys.stdin)['jobs']:
              print(j['mode'], j['file'])
              assert j['file']['size'] > 1000
          "
          id=$(curl -s -b jar http://127.0.0.1:8787/api/jobs | python3 -c "import json,sys; print(json.load(sys.stdin)['jobs'][0]['id'])")
          curl -sf -b jar -o out.bin "http://127.0.0.1:8787/api/files/$id" && ls -la out.bin
          echo "::notice title=Smoke test::Image builds, signs in, downloads video and MP3"

      - name: Try real links from this cloud machine
        continue-on-error: true
        run: docker run --rm --network host -v "$PWD/tests:/tests:ro" -e PYTHONPATH=/app vidharbor-cloud python /tests/cloud_probe.py

      - name: Server log
        if: always()
        run: docker logs vh 2>&1 | tail -50
