name: RedNote probe

# Diagnostic: which way of visiting RedNote returns the note data.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tests/rednote_probe.py', '.github/workflows/rednote-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -U "yt-dlp[default]" playwright && python -m playwright install --with-deps chromium
      - run: python tests/rednote_probe.py
